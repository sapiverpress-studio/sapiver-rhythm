name: Set up Expo project

on:
  push:
    paths:
      - .github/workflows/setup-expo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create and link EAS project
        run: eas init --non-interactive --force

      - name: Verify project link
        run: |
          node -e "const c=require('./app.json'); if(!c.expo?.extra?.eas?.projectId) throw new Error('EAS projectId was not written'); console.log('Linked project:', c.expo.extra.eas.projectId)"
          npx expo config --type public

      - name: Commit project ID
        run: |
          if git diff --quiet -- app.json; then
            echo "app.json already linked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Link Sapiver Rhythm to Expo"
          git push
