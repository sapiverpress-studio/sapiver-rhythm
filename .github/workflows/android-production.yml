name: Android production AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate project
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Build production Android App Bundle
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl // empty' eas-build.json)
          if [ -z "$BUILD_URL" ]; then
            echo "Production build finished but no AAB download URL was returned."
            cat eas-build.json
            exit 1
          fi
          if ! curl --fail --location --retry 3 "$BUILD_URL" -o sapiver-rhythm-production.aab; then
            curl --fail --location --retry 3 -H "Authorization: Bearer $EXPO_TOKEN" "$BUILD_URL" -o sapiver-rhythm-production.aab
          fi
          test -s sapiver-rhythm-production.aab
          ls -lh sapiver-rhythm-production.aab

      - name: Upload AAB for Play Console
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-rhythm-production-aab
          path: sapiver-rhythm-production.aab
          retention-days: 1
          if-no-files-found: error
