name: Prepare Play icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/play-icon.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare 512px Play icon
        run: |
          npm install --no-save --package-lock=false sharp
          node - <<'NODE'
          const fs = require('node:fs');
          const sharp = require('sharp');
          (async () => {
            await sharp('assets/icon.png').resize(512, 512).png().toFile('play-icon-512.png');
            const meta = await sharp('play-icon-512.png').metadata();
            if (meta.width !== 512 || meta.height !== 512 || meta.format !== 'png') {
              throw new Error(`Unexpected icon output: ${JSON.stringify(meta)}`);
            }
            const bytes = fs.statSync('play-icon-512.png').size;
            if (bytes > 1048576) throw new Error(`Play icon exceeds 1 MB: ${bytes}`);
            console.log(`Play icon verified: ${meta.width}x${meta.height}, ${bytes} bytes`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload Play icon
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-rhythm-play-icon
          path: play-icon-512.png
          retention-days: 1
          if-no-files-found: error
