name: Prepare Play icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/play-icon.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare 512px Play icon
        run: |
          ffmpeg -y -i assets/icon.png -vf scale=512:512 -frames:v 1 play-icon-512.png
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 play-icon-512.png)" = "512x512"
          test "$(stat -c%s play-icon-512.png)" -le 1048576
          file play-icon-512.png
          ls -lh play-icon-512.png

      - name: Upload Play icon
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-rhythm-play-icon
          path: play-icon-512.png
          retention-days: 1
          if-no-files-found: error
