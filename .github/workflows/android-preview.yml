name: Android preview build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-preview.yml

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Start Android preview build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate project
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Submit Android APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
