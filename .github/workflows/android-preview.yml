name: Android preview build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-preview.yml

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Start corrected Android preview build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Validate project
        run: |
          npm run typecheck
          npx expo-doctor

      - name: Save dependency alignment
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Align corrected build with Expo SDK"
          git push

      - name: Submit Android APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
